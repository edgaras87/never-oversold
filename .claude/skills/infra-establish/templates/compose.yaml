# Template — master copy in correctness-by-construction (ADR-0008);
# checked against concept v1 (ADR-0003, ADR-0005 — practice-born).
# Extracted 2026-08-28 from checkout-system's lived compose.yaml
# (PLAN Step 6). Changes on extraction: identities generalized to
# placeholders — <project> (hyphenated where naming allows,
# underscored in SQL identifiers), <project_db>; run-local ADR
# references generalized to neutral wording. Copy into a run and
# fill; the filled file is the run's own (ADR-0008).

# The infrastructure ground, as the run's decisions established it.
# Front door: podman compose. Secrets and machine variance live in .env
# (git-ignored; shape in .env.example); decided identities are literal.
name: <project>         # pinned: volume/network identity must not depend
                        # on the directory this file runs from
services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: <project>-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: <project_db>
    ports:
      - "${POSTGRES_PORT:-5432}:5432"      # host side = machine variance
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d <project_db>"]
      interval: 5s
      timeout: 3s
      retries: 10

  flyway:                                   # the only DDL path — a one-shot,
    image: docker.io/flyway/flyway:11       # hidden from plain `up`
    profiles: ["migrate"]
    environment:
      FLYWAY_USER: <project>_migrator
      FLYWAY_PASSWORD: ${FLYWAY_MIGRATOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/flyway/conf:/flyway/conf:ro,Z
      - ./infrastructure/flyway/migrations:/flyway/sql:ro,Z

volumes:
  postgres-data:        # bare name — compose prefixes the pinned project name

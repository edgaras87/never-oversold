# Flyway — the only DDL path (ADR-0006, C2).
# No credentials here: user/password are env-passed by compose
# (FLYWAY_USER=migrator). The url speaks the compose network's
# service name — this config is for the one-shot container. Filled
# from the infra-establish templates (kit @ af16eb7).
flyway.url=jdbc:postgresql://postgres:5432/never_oversold
flyway.schemas=never_oversold
flyway.locations=filesystem:/flyway/sql
